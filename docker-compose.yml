services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fasttaskmanager_db
      POSTGRES_USER: fasttaskmanager
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasttaskmanager -d fasttaskmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=fasttaskmanager password=password dbname=fasttaskmanager_db sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy